name: "受け入れ: 秘密の値"
# パスワードは環境変数 UIAI_DEMO_PASSWORD から読む（値は password123）。
# AI には (password) のまま渡り、記録・通知には出ない。
app:
  web: "../web-demo/index.html"
config:
  interrupts:
    allow: ["Cookie の同意"]

variables:
  email: "test@example.com"
  password:
    env: UIAI_DEMO_PASSWORD
    secret: true

steps:
  - id: "ログイン"
    actions:
      - do: "アプリを開く"
      - do: "メールアドレス欄に「(email)」を入力"
      - do: "パスワード欄に「(password)」を入力"
      - do: "ログインボタンを押す"
      - then: "「ようこそ」と表示されていること"
