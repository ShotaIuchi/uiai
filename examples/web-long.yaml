name: "Web 試験アプリ（長いシナリオ）"
# 50 ステップ級の計測用（設計書 14 章 段階 4）。序盤と終盤で 1 ステップの時間が変わらないかを見る。
app:
  web: "web-demo/index.html"

config:
  interrupts:
    allow: ["Cookie の同意"]

steps:
  - id: "起動"
    actions:
      - do: "アプリを開く"
      - then: "ログイン画面が表示されていること"

  - id: "ログイン"
    actions:
      - do: "メールアドレス欄に「test@example.com」を入力"
      - do: "パスワード欄に「password123」を入力"
      - do: "ログインボタンを押す"
      - then: "「ようこそ」と表示されていること"

  - id: "タスク追加1"
    actions:
      - do: "タスク画面を開く"
      - then: "タスク一覧に「レポートを書く」があること"
      - do: "「牛乳を買う」というタスクを追加する"
      - then: "「タスクを追加しました」というトーストが表示されていること"
      - then: "タスク一覧に「牛乳を買う」があること"
      - do: "「パンを買う」というタスクを追加する"
      - then: "タスク一覧に「パンを買う」があること"
      - do: "「洗濯をする」というタスクを追加する"
      - then: "タスク一覧に「洗濯をする」があること"

  - id: "タスク追加2"
    actions:
      - do: "「本を返す」というタスクを追加する"
      - then: "タスク一覧に「本を返す」があること"
      - do: "「花に水をやる」というタスクを追加する"
      - then: "タスク一覧に「花に水をやる」があること"
      - do: "「部屋を掃除する」というタスクを追加する"
      - then: "タスク一覧に「部屋を掃除する」があること"

  - id: "タスク完了"
    actions:
      - do: "「牛乳を買う」を完了にする"
      - then: "「牛乳を買う」が完了状態になっていること"
      - do: "「パンを買う」を完了にする"
      - then: "「パンを買う」が完了状態になっていること"
      - do: "「会議の準備」を未完了に戻す"
      - then: "「会議の準備」が完了状態ではないこと"

  - id: "ホーム"
    actions:
      - do: "ホーム画面を開く"
      - then: "「ようこそ」と表示されていること"

  - id: "検索"
    actions:
      - do: "検索画面を開く"
      - do: "「東京」で検索する"
      - then: "「4件の結果」と表示されていること"
        strict: true
      - then: "検索結果に「東京タワー」があること"
      - then: "検索結果に「大阪城」がないこと"
      - do: "ホーム画面を開く"
      - then: "「ようこそ」と表示されていること"

  - id: "ダークモード"
    actions:
      - do: "設定画面を開く"
      - do: "ダークモードをONにする"
      - do: "設定を保存する"
      - then: "保存完了のメッセージが表示されていること"
      - then: "画面がダークモードになっていること"

  - id: "設定を戻す"
    actions:
      - do: "ダークモードをOFFにする"
      - do: "通知メールを受け取る設定をOFFにする"
      - do: "設定を保存する"
      - then: "画面が明るい配色に戻っていること"
      - then: "「通知メールを受け取る」のスイッチがOFFになっていること"

  - id: "最終確認"
    actions:
      - do: "タスク画面を開く"
      - then: "タスク一覧に「部屋を掃除する」があること"
      - then: "「牛乳を買う」が完了状態になっていること"
      - then: "エラーが表示されていないこと"
