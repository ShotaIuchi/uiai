name: "Web 試験アプリ"
# このファイルからの相対パス（file:// で開く）
app:
  web: "web-demo/index.html"

config:
  interrupts:
    # 読み込み 1.5 秒後に出る Cookie 同意ダイアログは、シナリオに書かずに AI に閉じさせる。
    # 許可リストに入れているので警告にはならない（外すと「警告付き合格」になる）。
    allow: ["Cookie の同意"]

steps:
  - id: "起動"
    actions:
      - do: "アプリを開く"
      - then: "ログイン画面が表示されていること"

  - id: "ログイン"
    actions:
      - do: "メールアドレス欄に「test@example.com」を入力"
      - do: "パスワード欄に「password123」を入力"
      - do: "ログインボタンを押す"
      - then: "「ようこそ」と表示されていること"

  - id: "タスク"
    actions:
      - do: "タスク画面を開く"
      - do: "「牛乳を買う」というタスクを追加する"
      - then: "「タスクを追加しました」というトーストが表示されていること"
      - then: "タスク一覧に「牛乳を買う」があること"
      - do: "「牛乳を買う」を完了にする"
      - then: "「牛乳を買う」が完了状態になっていること"

  - id: "設定"
    actions:
      - do: "設定画面を開く"
      - do: "ダークモードをONにする"
      - do: "設定を保存する"
      - then: "保存完了のメッセージが表示されていること"
      - then: "画面がダークモードになっていること"

  - id: "検索"
    actions:
      - do: "検索画面で「東京」を検索する"
      - then: "東京に関する検索結果が表示されていること"
