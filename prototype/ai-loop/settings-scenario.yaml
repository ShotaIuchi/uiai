name: "設定アプリ（AIループ速度計測用）"
app: "com.android.settings"
# 検索画面は別パッケージなので、前回の検索画面が残らないよう一緒に停止する
reset_packages:
  - "com.google.android.settings.intelligence"

steps:
  - id: "起動"
    actions:
      - do: "アプリを起動"
      - then: "設定のトップ画面が表示されていること"

  - id: "ディスプレイ"
    actions:
      - do: "ディスプレイの設定を開く"
      - then: "ディスプレイ設定画面が表示されていること"
      - do: "ダークテーマをONにする"
      - then: "ダークテーマがONになっていること"
      - do: "ダークテーマをOFFに戻す"
      - then: "ダークテーマがOFFになっていること"
      - do: "前の画面に戻る"

  - id: "端末情報"
    actions:
      - do: "端末情報（About）の画面を開く"
      - then: "端末情報画面が表示されていること"
      - do: "前の画面に戻る"

  - id: "検索"
    actions:
      - do: "設定の検索を開く"
      - do: "「battery」と入力"
      - then: "バッテリー関連の検索結果が表示されていること"
