# =============================================================================
# テストシナリオテンプレート
# このファイルをコピーして新しいシナリオを作成してください
# =============================================================================

name: "シナリオ名"
app: "com.example.app"

# オプション設定（必要な場合のみ。すべての項目は skills/test/references/scenario-schema.md）
# config:
#   timeout: 600                 # シナリオ全体の上限（秒、既定 600。do 1 つに 10 秒は見込む）
#   then_timeout: 5              # then が合格になるまで待つ上限の既定（秒）
#   clear_data_before: true      # 実行前にアプリのデータを消す（Android）
#   stop_app_after: true         # 実行後にアプリを止める
#   strict: true                 # 厳格モード（全 do/then を一字一句の完全一致で判定）

# 変数定義（必要な場合のみ）
# variables:
#   email: "test@example.com"    # 変数を定義
#   office: "東京本社"           # 日本語も使用可能
#   password:                    # 秘密の値は環境変数から読み、AI に渡さない
#     env: TEST_PASSWORD
#     secret: true

steps:
  # ----------------------------------------------------------------------------
  # セクション: id と actions でグループ化
  # ----------------------------------------------------------------------------
  - id: "セクション1"
    actions:
      - do: "アプリを起動"
      - then: "期待する画面が表示されていること"

  # ----------------------------------------------------------------------------
  # 次のセクション
  # ----------------------------------------------------------------------------
  - id: "セクション2"
    actions:
      - do: "次のアクション"
      - do: "別のアクション"
      - then: "期待結果"

# =============================================================================
# アクション（do）の書き方例
# =============================================================================
#
# タップ:
#   - do: "「ログイン」ボタンをタップ"
#   - do: "メニューを選択"
#   - do: "OKをタップ"
#
# 入力:
#   - do: "メールアドレス欄に「test@example.com」を入力"
#   - do: "「パスワード」と入力"
#
# スクロール:
#   - do: "下にスクロール"
#   - do: "「Item 50」が見えるまでスクロール"
#
# ナビゲーション:
#   - do: "戻るボタンを押す"
#   - do: "ホームに戻る"
#
# 待機:
#   - do: "3秒待つ"
#     wait: 3  # または wait フィールドで指定
#
# =============================================================================
# 期待結果（then）の書き方例
# =============================================================================
#
# 画面確認:
#   - then: "ホーム画面が表示されていること"
#   - then: "ログイン画面が開いていること"
#
# 要素確認:
#   - then: "「東京本社」と表示されていること"
#   - then: "リストに5件以上表示されていること"
#
# 否定形:
#   - then: "エラーメッセージが表示されていないこと"
#   - then: "ローディングが消えていること"
#
# 厳格モード（個別指定）:
#   - then: "「東京本社」と表示されていること"
#     strict: true  # このthenのみ完全一致検証
#
# =============================================================================
# リプレイ（replay）の書き方
# =============================================================================
#
# 過去のセクションの do アクションを再実行（then はスキップ）
#
# 単一セクション:
#   - id: "リプレイ確認"
#     replay:
#       from: "ログイン"
#       to: "ログイン"
#     actions:
#       - then: "再実行後も正常に動作すること"
#
# 範囲指定:
#   - id: "全体リプレイ"
#     replay:
#       from: "起動"
#       to: "データ入力"
#     actions:
#       - then: "一連の操作が正常に完了すること"
#
# ※リプレイ先に replay がある場合は再帰的に実行される
#
# =============================================================================
# 別のデバイスで実行するセクション（on）
# =============================================================================
#
# セクションに on: android / ios / web を書くと、そのセクションだけそのデバイスで実行する
# （on のないセクションは実行時のデバイス）。対象は app に書いておく
#
# app:
#   android: "com.example.app"
#   web: "https://admin.example.com"
# steps:
#   - id: "申請"
#     actions:
#       - do: "アプリを開いて休暇を申請する"
#   - id: "承認"
#     on: web
#     actions:
#       - do: "管理画面を開いて、最新の申請を承認する"
#   - id: "結果"
#     actions:
#       - do: "申請一覧を開き直す"
#       - then: "「承認済み」と表示されていること"
#
# =============================================================================
# 別のシナリオの読み込み（include）
# =============================================================================
#
# 単体でも実行できるシナリオを、セクションの代わりにその位置に読み込む（パスはこのファイルから）
# on を書くと、読み込んだセクションをそのデバイスで実行する
#
# steps:
#   - include: "parts/login.yaml"
#   - include: "parts/approve.yaml"
#     on: web
#   - id: "本題"
#     actions:
#       - do: "..."
#
# =============================================================================
# 変数（variables）の書き方
# =============================================================================
#
# 定義:
#   variables:
#     email: "test@example.com"
#     office: "東京本社"
#
# 使用（補間）:
#   - do: "メールアドレス欄に「(email)」を入力"
#   - then: "「(office)」と表示されていること"
#
# エスケープ（リテラルの括弧を使用する場合）:
#   - do: "「\(1+2\)」を計算"  # → 「(1+2)」として解釈
#
# 変数名のルール:
#   - 英字またはアンダースコアで始まる
#   - 英数字とアンダースコアのみ使用可能
#   - 例: email, password_1, _private, user2
#
# =============================================================================
# 環境変数と秘密の値
# =============================================================================
#
#   variables:
#     user_id:
#       env: TEST_USER_ID              # 環境変数から読む
#     password:
#       env: TEST_PASSWORD
#       secret: true                   # 秘密の値
#
# 秘密の値（secret: true）:
#   - AI に値を渡さない。AI は「(password)」のまま入力を指示し、エンジンが入力の直前に置き換える
#   - 記録・レポート・通知では **** に伏せる
#   - then では使えない（AI が照合できないため）
#   - 値はシナリオファイルに書かず、env: で渡す
#
# =============================================================================
# 値のない変数（対話入力）
# =============================================================================
#
# 値を省略するか null にすると、実行の前に端末で入力を求められる:
#
#   variables:
#     email: "test@example.com"        # 固定値
#     office:                          # 値を省略 → 実行時に入力
#     department: null                 # null → 実行時に入力（明示的）
#
# 入力を求めるときの文言を指定:
#
#   variables:
#     api_key:
#       prompt: "APIキーを入力してください"
#
# 値の決まり方（上から順に）:
#   1. uiai run --var 名前=値
#   2. シナリオに書いた値（"" も有効な値）
#   3. env: の環境変数
#   4. 対話入力（端末から直接実行したときだけ。全シナリオの分を実行の前にまとめて聞く）
#
# どれでも決まらない変数があると、そのシナリオは実行しない（終了コード 2）。
# CI や /uiai:test のバックグラウンド実行では対話入力できないため、--var か env: で渡す。
#
