name: "iOS 設定アプリ"
app:
  ios: "com.apple.Preferences"

steps:
  - id: "起動"
    actions:
      - do: "アプリを起動"
      - then: "設定のトップ画面が表示されていること"

  # シミュレータには「画面表示と明るさ」がないため、ダークモードは「デベロッパ」で切り替える
  - id: "ダークモード"
    actions:
      - do: "「デベロッパ」の設定を開く"
      - then: "デベロッパの設定画面が表示されていること"
      - do: "ダーク外観（ダークモード）をONにする"
      - then: "ダーク外観がONになり、画面が暗い配色になっていること"
      - do: "ダーク外観をOFFに戻す"
      - then: "ダーク外観がOFFになり、画面が明るい配色になっていること"
      - do: "前の画面に戻る"

  - id: "情報"
    actions:
      - do: "「一般」を開き、「情報」を開く"
      - then: "情報の画面に iOS のバージョンが表示されていること"
      - do: "設定のトップ画面まで戻る"

  - id: "検索"
    actions:
      - do: "設定の検索欄に「Siri」と入力"
      # シミュレータの設定アプリは検索結果が出ないことがあるため、入力した文字だけを確かめる
      - then: "検索欄に「Siri」と表示されていること"
        strict: true
